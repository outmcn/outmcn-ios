name: Build IPA (TrollStore)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project OutMCN.xcodeproj -scheme OutMCN -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/OutMCN.app"
          if [ ! -d "$APP" ]; then
            echo "❌ App 产物未找到:"; ls build/Build/Products/ 2>/dev/null
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr OutMCN.ipa Payload
          ls -lh OutMCN.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutMCN-unsigned-ipa
          path: OutMCN.ipa
          if-no-files-found: error